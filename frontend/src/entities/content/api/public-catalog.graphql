query PublicCatalog(
  $first: Int!
  $after: String
  $search: String
  $type: ContentType
  $categoryId: String
  $tagId: String
  $authorId: String
) {
  publishedContents(
    first: $first
    after: $after
    search: $search
    type: $type
    categoryId: $categoryId
    tagId: $tagId
    authorId: $authorId
  ) {
    items {
      id
      title
      description
      type
      status
      thumbnail
      publishedAt
      author {
        id
        username
      }
      category {
        name
      }
    }
    endCursor
    hasMore
  }
}
