mutation RefreshSession {
  refreshTokens {
    accessToken
    account {
      id
      email
      username
      roles
      hasPassword
    }
  }
}

mutation Login($data: LoginInput!) {
  login(data: $data) {
    accessToken
    account {
      id
      email
      username
      roles
      hasPassword
    }
  }
}

mutation Signup($data: SignupInput!) {
  signup(data: $data) {
    accessToken
    account {
      id
      email
      username
      roles
      hasPassword
    }
  }
}

mutation Logout {
  logout
}
