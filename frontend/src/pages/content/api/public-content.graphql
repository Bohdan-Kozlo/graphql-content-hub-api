query PublicContent($id: String!) {
  content(id: $id) {
    id
    title
    description
    type
    body
    mediaUrl
    thumbnail
    status
    publishedAt
    likeCount
    liked
    saved
    author {
      id
      username
      bio
      avatarUrl
    }
    category {
      id
      name
    }
    tags {
      id
      name
    }
    source {
      id
      name
      url
    }
  }
}
