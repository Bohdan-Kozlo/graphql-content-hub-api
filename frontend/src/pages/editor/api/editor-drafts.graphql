query MyDrafts {
  myDrafts {
    id
    title
    description
    type
    status
    category {
      id
      name
    }
    tags {
      id
      name
    }
    source {
      id
      name
    }
  }
}

query MyDraft($id: String!) {
  myDraft(id: $id) {
    id
    title
    description
    type
    body
    status
    category {
      id
      name
    }
    tags {
      id
      name
    }
    source {
      id
      name
    }
  }
}

query EditorMetadataOptions {
  categories {
    id
    name
  }
  tags {
    id
    name
  }
  sources {
    id
    name
  }
}

mutation CreateEditorDraft($data: CreateContentInput!) {
  createContent(data: $data) {
    id
  }
}

mutation UpdateEditorDraft($id: String!, $data: UpdateContentInput!) {
  updateContent(id: $id, data: $data) {
    id
  }
}
