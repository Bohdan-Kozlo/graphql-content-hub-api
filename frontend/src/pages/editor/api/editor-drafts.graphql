query MyDrafts {
  myDrafts {
    id
    title
    description
    type
    status
    category {
      id
      name
    }
    tags {
      id
      name
    }
    source {
      id
      name
    }
  }
}

query MyPublishedContents {
  myPublishedContents {
    id
    title
    description
    type
    status
    publishedAt
    category {
      id
      name
    }
  }
}

query MyContent($id: String!) {
  myContent(id: $id) {
    id
    title
    description
    type
    body
    mediaUrl
    thumbnail
    duration
    status
    publishedAt
    category {
      id
      name
    }
    tags {
      id
      name
    }
    source {
      id
      name
    }
  }
}

query EditorMetadataOptions {
  categories {
    id
    name
  }
  tags {
    id
    name
  }
  sources {
    id
    name
  }
}

mutation CreateEditorDraft($data: CreateContentInput!) {
  createContent(data: $data) {
    id
  }
}

mutation UpdateEditorDraft($id: String!, $data: UpdateContentInput!) {
  updateContent(id: $id, data: $data) {
    id
  }
}

mutation PublishEditorDraft($id: String!) {
  publishContent(id: $id) {
    id
    status
    publishedAt
  }
}

mutation RemoveEditorContent($id: String!) {
  removeContent(id: $id)
}
